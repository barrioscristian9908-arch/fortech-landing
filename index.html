<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortech</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Configuracion Tailwind -->
    <style type="text/tailwindcss">
        @theme {
            /* Colores principales */
            --color-fortech: #C62828;
            --color-fortech-dark: #991B1B;

            /* Colores neutros */
            --color-dark: #171717;
            --color-white: #FFFFFF;
            --color-light: #F2F2F2;
            --color-gray-custom: #737373;
        }
    </style>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

     <!-- Menu -->
    <header>

        <div class="topbar">
            <div class="container">
                <div class="contacto">
                    <a href="tel:+543701234567">
                        <i class="bi bi-telephone-fill"></i>
                        +54 370 1234567
                    </a>

                    <a href="#">
                        <i class="bi bi-instagram"></i>
                        @fortech
                    </a>
                </div>
            </div>
        </div>

        <div class="navbar">
            <nav class="container navbar-container">
                <img class="logo" src="img/odontologia.png" alt="Logo de la empresa">

                <button class="menu-toggle">
                    <i class="bi bi-list"></i>
                </button>

                <ul class="nav-links">
                    <li><a href="#hero">Inicio</a></li>
                    <li><a href="#nosotros">Produtos</a></li>
                    <li><a href="#servicios">Nosotros</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>

                <a href="#" class="btn-consulta">
                    Consultar
                </a>

            </nav>
        </div>

    </header>
    <!-- Fin Menu -->

    <!-- Hero -->
        <main id="hero" class="hero relative">

            <div class="hero-overlay"></div>

            <div class="container relative z-10">

                <div class="hero-content">

                    <h1>
                        Todo lo que necesitás para construir,
                        <span>en un solo lugar.</span>
                    </h1>

                    <p>
                        Materiales de construcción, zinguería,
                        PVC y mucho más. Venta mayorista y minorista.
                    </p>

                    <div class="hero-buttons">

                        <a href="#" class="btn-principal">
                            Consultar por WhatsApp
                        </a>

                        <a href="#productos" class="btn-secundario">
                            Ver productos
                        </a>

                    </div>

                </div>

            </div>

        </main>
    <!-- Fin Hero -->
    

    <script src="javascript/main.js"></script>
</body>
</html>
